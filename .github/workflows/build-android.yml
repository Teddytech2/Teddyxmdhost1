name: Build TEDDY-XMD Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'public/app-config.json'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download and generate TEDDY-XMD launcher icons
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from urllib.request import urlopen
          from PIL import Image
          from io import BytesIO
          from pathlib import Path
          url = 'https://url.bmbxmd.workers.dev/1JNK9.jpg'
          data = urlopen(url, timeout=30).read()
          image = Image.open(BytesIO(data)).convert('RGBA')
          sizes = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          root = Path('android/app/src/main/res')
          for density, size in sizes.items():
              folder = root / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              icon = image.copy()
              icon.thumbnail((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (size, size), (9, 10, 12, 255))
              x = (size - icon.width) // 2
              y = (size - icon.height) // 2
              canvas.alpha_composite(icon, (x, y))
              canvas.save(folder / 'ic_launcher.png')
              canvas.save(folder / 'ic_launcher_round.png')
          PY

      - name: Build APK
        run: gradle -p android assembleDebug

      - name: Install APK into dashboard downloads
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/TEDDY-XMD.apk

      - name: Commit APK for dashboard download
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/downloads/TEDDY-XMD.apk
          if git diff --cached --quiet; then
            echo 'APK is unchanged; no commit needed.'
          else
            git commit -m 'Build TEDDY-XMD Android APK'
            git push
          fi
